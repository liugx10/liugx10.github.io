# Liu Guoxuan 的个人博客 —— 站点全局配置
#
# 主题：Minimal Mistakes，以「远程主题」方式安装（GitHub Pages 的主题白名单里
# 没有它，但 jekyll-remote-theme 在白名单内，所以不必改用 GitHub Actions）。
#
# 注意：主题自带的 _config.yml 不会被继承——Jekyll 只从主题挂载 _layouts、
# _includes、_sass、assets 四个目录。因此主题需要的配置必须全部写在本文件里，
# 不能指望从 mmistakes/minimal-mistakes 那边读到默认值。

# ---------- 主题 ----------
# theme: 和 remote_theme: 只能留一个。这里用 remote_theme，原先的 theme: minima 已删除。
# 末尾的 @4.28.1 是版本号，升级时改这里，不要留空（留空会跟随 master，构建结果不稳定）。
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
# 皮肤。可选：default air aqua contrast dark dirt neon mint plum sunrise
#       catppuccin_latte catppuccin_mocha
minimal_mistakes_skin: "default"

# ---------- 站点信息 ----------
locale: "zh-CN"                 # 界面文案语言，主题内置简体中文
title: "Liu Guoxuan的个人博客"
title_separator: "-"
name: "Liu Guoxuan"
description: "记录技术与生活"
url: "https://liugx10.github.io"   # 分享按钮、feed、绝对链接都要用到
repository: "liugx10/liugx10.github.io"
date_format: "%Y 年 %-m 月 %-d 日"  # 文章日期格式（strftime，% 后加减号表示去掉前导零）

# 时区。**必须设**：线上构建按 UTC 跑（页面的 article:published_time 会显示 +00:00），
# 不设这一项，北京时间 0:00–8:00 推送的「当天」文章会被当成未来时间而静默不发布。
timezone: "Asia/Shanghai"

# 分享卡片的默认缩略图（微信 / 钉钉 / 飞书 / 微博抓的是 og:image）。文章可用自己
# front matter 里的 og_image 覆盖。换图直接替换 assets/images/ 下这个文件即可。
og_image: "/assets/images/og-default.png"

# 作者资料卡：**只在首页左侧栏显示**，由 index.html front matter 里的
# author_profile: true 打开（defaults 里故意不给文章页和 _pages 开）。
# 因为卡片只在这一处渲染，写进 links 的内容（含邮箱）就只会出现在主页。
# avatar 目前是占位图，换真人头像直接替换这个文件即可；主题把它裁成圆形、
# 最大 110px（.author__avatar img），所以图要正方形、边长 ≥ 220px。
author:
  name: "Liu Guoxuan"
  avatar: "/assets/images/avatar-default.png"
  bio: "记录技术与生活"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/liugx10"
    - label: "个人主页"
      icon: "fas fa-fw fa-home"
      url: "https://liugx10.github.io"
    - label: "邮箱"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:liugx17@tsinghua.org.cn"   # 因为卡片只在主页渲染，邮箱也只出现在主页

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/liugx10"

# ---------- 网址 ----------
# 分类会成为网址的一部分：categories: 随笔 的文章 → /随笔/hello-world/
permalink: /:categories/:title/
paginate: 5
paginate_path: /page:num/

# 分类与标签归档。type: liquid = 用主题自带的 Liquid 方案生成索引页，每个分类/标签是
# 页内一个锚点（/categories/#随笔、/tags/#随笔）。**不需要插件**——每个分类/标签一个
# 独立网址要 jekyll-archives，而它不在 GitHub Pages 的插件白名单里，写了会导致线上
# 构建失败。索引页本体在 _pages/category-archive.md 和 _pages/tag-archive.md。
#
# 两个块都配上，文章页顶部才会出现对应的「分类:」「标签:」链接行——主题的
# page__taxonomy.html 是对两者分别判断的，少一个就少一行。
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# ---------- 构建 ----------
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

sass:
  sass_dir: _sass
  style: compressed

# 下划线开头的目录默认不处理，_pages 要显式包含进来才能被构建
include:
  - _pages

# 只能用 GitHub Pages 白名单内的插件，写别的会导致线上构建失败
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache   # Minimal Mistakes 必须，缺了会报 Unknown tag 'include_cached'

# 文章/页面的默认值，新文章不必在 front matter 里重复写
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single          # 主题没有名为 post 的 layout，文章用的是 single
      # 不设 author_profile：作者资料卡只在首页显示（index.html 里单独打开）。
      # 但左栏要留给推荐块，所以得给 page.sidebar 一个值——主题的侧栏容器只在
      # `page.author_profile or layout.author_profile or page.sidebar` 为真时才渲染。
      # 推荐内容写在 _includes/sidebar-custom.html（主题官方扩展点，不覆盖任何模板）。
      sidebar: { nav: "main" }
      show_date: true         # 不写这项，文章页不会显示日期
      read_time: false        # 阅读时长按空格分词统计，中文正文会被算成个位数，
                              # 一律显示「少于 1 分钟」，所以关闭
      share: true             # 文章底部的分享按钮
      related: true           # 文章底部的「猜您还喜欢」
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single          # 同样不设 author_profile，独立页面也不显示作者卡

# 不发布到网站的文件（前 7 项是 Jekyll 默认值，必须一并列出，否则设置 exclude 会覆盖默认值）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - CLAUDE.md
  - JEKYLL_GUIDE.md
